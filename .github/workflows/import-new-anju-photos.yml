name: Import new Anju portraits once
on:
  push:
    paths:
      - '.github/workflows/import-new-anju-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image conversion
        run: python -m pip install --quiet Pillow
      - name: Download and optimize supplied images
        env:
          PHOTO_MANIFEST: '[["collage-purple-saree","https://d2jqrm6oza8nb6.cloudfront.net/datasets/fa212bc0-5a99-43ff-bfb0-ecd448fefa53.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTc5ZGVhYTY4ZTAxMTAzYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI3NTIzOH0.TfMs_n8z-7LB_W4qqoE0e9sX8BpRRSzikH2K-R_NOUQ"],["green-purple-saree-outdoor","https://d2jqrm6oza8nb6.cloudfront.net/datasets/f22eae66-15da-4d81-b443-8a9faf9d6cd2.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODVhNDg0MzRkOWI1ZjZiMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI1Mzg3Nn0.C0UWKhpaxWCCAsO6rxEfEWi4U6gDpKQxUGAVEw2oQoA"],["magenta-saree-indoor","https://d2jqrm6oza8nb6.cloudfront.net/datasets/b04e454e-2fc6-4898-945d-cc01672805f7.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjVhMTMzM2JjMzRmNmQ0OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI2NTQwM30.9Gl_tnEBgCAxoMxO3GXukqLAkgU0597z0XuaWwMeqM0"],["teal-dress-tram","https://d2jqrm6oza8nb6.cloudfront.net/datasets/ed9ab864-27e7-4a14-a286-bf508c4b8723.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGUyYzZhZTg2NWZkM2FmYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDIwMTU3Nn0.yJeumpMHjr9FZAKnG8bKALs8ygXMuVWHYy1bFuNQXn8"],["purple-saree-diya-hero","https://d2jqrm6oza8nb6.cloudfront.net/datasets/34f62cae-d8c9-4b95-85f4-0eeeacca9c7b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjM1Nzg3MTRiNmU0ZTNhMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI0NjY3Nn0.I12DS3jj8JwG83eo22Q4DPciLUZ2GgAbMIcOJypuIkM"],["red-dress-fairy-lights","https://d2jqrm6oza8nb6.cloudfront.net/datasets/1f06f806-b229-456f-bf95-0e964c9a532e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmJmMzFmYzY4NTliMzhiOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDIwMDc3NH0.e3jv7phuPJEHr8QSWwIbvwj0kDRxoOr0AVT0wJLBGSE"],["mirror-selfie-mint","https://d2jqrm6oza8nb6.cloudfront.net/datasets/562ad9b9-8d02-4fe4-b3ae-a34d19a9e2e7.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjI5ZDI1ZTY3NjAwODkzMyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDIxNDUwMn0.7cEb2VDR2FYtU-OyPLGQ_TPfA1m-JSYhlQzsHqUDsPQ"],["golden-fantasy-palace","https://d2jqrm6oza8nb6.cloudfront.net/datasets/79033dac-b659-4408-a008-a353cf9c5f8d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmM0OTAwN2VjNzg3MjJmOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI2MTg4Nn0.m6ExTtrUPFlUhh73RWwn4MMKVoZvvHvfRwqSB6ySgR0"],["ivory-sequin-indoor","https://d2jqrm6oza8nb6.cloudfront.net/datasets/596c3bf0-fd3b-4ff5-b4a1-6b83d8446d1d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGE2ZWY5NTFlYWNkZmNlYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE5MjU5M30.vYOTtC0hf_9S6xFAUW9NI4w0FKetBkjE6ZGLJA2Q4eI"],["vespa-pink-saree","https://d2jqrm6oza8nb6.cloudfront.net/datasets/57cb8c7f-d844-4ef1-946e-2af8b387b84c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNWZlYjlkZDM4MTFjNWM3ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI1OTI4M30.rIx3iA03Q_jZEENWRFkU0Ol7BmEu8B70DJ-7HZ91pOs"]]'
        run: |
          python - <<'PY'
          import json,os,urllib.request,io,pathlib
          from PIL import Image,ImageOps
          entries=json.loads(os.environ["PHOTO_MANIFEST"])
          out=pathlib.Path("assets/photos")
          out.mkdir(parents=True,exist_ok=True)
          for slug,url in entries:
              assert slug.replace("-","").isalpha(),slug
              req=urllib.request.Request(url,headers={"User-Agent":"MereAnjuPhotoImporter/1.0"})
              with urllib.request.urlopen(req,timeout=75) as resp:
                  payload=resp.read(14*1024*1024)
              assert len(payload)>10000,(slug,len(payload))
              with Image.open(io.BytesIO(payload)) as image:
                  image=ImageOps.exif_transpose(image).convert("RGB")
                  image.thumbnail((1400,1750),Image.Resampling.LANCZOS)
                  output=out/(slug+".jpg")
                  image.save(output,"JPEG",quality=86,optimize=True,progressive=True)
                  print("Saved",output,image.size,output.stat().st_size,flush=True)
          assert len(entries)==10
          PY
      - name: Commit new portrait photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/*saree*.jpg assets/photos/teal-dress-tram.jpg assets/photos/red-dress-fairy-lights.jpg assets/photos/mirror-selfie-mint.jpg assets/photos/golden-fantasy-palace.jpg assets/photos/ivory-sequin-indoor.jpg assets/photos/vespa-pink-saree.jpg
          git diff --cached --quiet && echo "All images already present" && exit 0
          git commit -m "assets: import ten optimized Anju festive portraits"
          git push
